[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "funmap"
version = "0.1.0"
description = "Reproducible analysis pipeline for FePt Janus micro-caps magnetization reversal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Natalia Gonzalez-Vazquez"},
    {name = "FunMaP Contributors"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
]

[project.scripts]
funmap = "funmap.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
